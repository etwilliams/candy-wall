<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Candy Wall</title>
<meta name="theme-color" content="#1b1b2f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font-family: 'Press Start 2P', monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; -webkit-tap-highlight-color: transparent; user-select: none; background: #1b1b2f; touch-action: none; }
  p { position: fixed; bottom: 4px; left: 0; right: 0; text-align: center; margin: 0; font-size: 8px; line-height: 1.6; padding: 0 12px; box-sizing: border-box; color: #888; pointer-events: none; transition: opacity 0.6s; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<p id="hint">Move: mouse / touch / ← → keys &nbsp;·&nbsp; Click / tap / Space: launch, restart, or pop the paddle up (a hit while popped boosts the ball) &nbsp;·&nbsp; Esc: pause &nbsp;·&nbsp; M: mute &nbsp;·&nbsp; Catch falling capsules for power-ups (red outline = bad)</p>
<script type="module" src="/src/main.js"></script>
</body>
</html>
